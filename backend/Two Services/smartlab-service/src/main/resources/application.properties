# ============================================================
# SmartLab AI — Business Service Configuration
# ============================================================

server.port=8082
spring.application.name=smartlab-service

# Database — smartlab
spring.datasource.url=jdbc:mysql://localhost:3306/smartlab?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Karthi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Script Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT Security — must match auth-service exactly
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServicesForSmartLabAI}
app.jwt.expiration-ms=3600000

# Eureka Discovery
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================================
# Gmail SMTP — TLS / App Password (same as auth-service)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartlab.college.auth@gmail.com
spring.mail.password=smzltbyohgnfwerj
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# ============================================================
# Google Gemini API Configuration
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash

