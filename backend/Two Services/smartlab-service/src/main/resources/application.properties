# ============================================================
# SmartLab AI — Business Service Configuration
# ============================================================

server.port=${PORT:8082}
spring.application.name=smartlab-service

# Database — smartlab
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartlab}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:${SMARTLAB_DB_USER:${SPRING_DATASOURCE_USERNAME:root}}}
spring.datasource.password=${MYSQL_PASSWORD:${SMARTLAB_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Karthi}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Safe, non-destructive schema update)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Script Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT Security — must match auth-service exactly
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServicesForSmartLabAI}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}

# Eureka Discovery
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.instance.prefer-ip-address=true

# ============================================================
# Gmail SMTP — TLS / App Password (same as auth-service)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:smartlab.college.auth@gmail.com}
spring.mail.password=${MAIL_PASSWORD:smzltbyohgnfwerj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ============================================================
# Google Gemini API Configuration
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

