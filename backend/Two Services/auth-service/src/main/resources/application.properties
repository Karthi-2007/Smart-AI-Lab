# ============================================================
# SmartLab AI — Auth Service Configuration
# ============================================================

# Server
server.port=8081
spring.application.name=auth-service

# ============================================================
# Database — auth_db (separate from business service)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Karthi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# JWT — shared secret, MUST match business service
# ============================================================
jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServicesForSmartLabAI}
jwt.expiration=3600000
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServicesForSmartLabAI}
app.jwt.expiration-ms=3600000

# ============================================================
# Gmail SMTP — TLS / App Password
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartlab.college.auth@gmail.com
spring.mail.password=smzltbyohgnfwerj
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# ============================================================
# OTP Configuration
# ============================================================
otp.expiry.minutes=5
otp.resend.cooldown.seconds=60
otp.cleanup.interval.ms=1800000

# ============================================================
# Eureka Service Discovery
# ============================================================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Logging
# ============================================================
logging.level.org.springframework.security=INFO
logging.level.com.auth=DEBUG
