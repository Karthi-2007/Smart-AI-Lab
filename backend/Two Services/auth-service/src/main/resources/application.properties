# ============================================================
# SmartLab AI — Auth Service Configuration
# ============================================================

# Server
server.port=${PORT:8081}
spring.application.name=auth-service

# ============================================================
# Database — auth_db (separate from business service)
# ============================================================
spring.datasource.url=${AUTH_DB_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${AUTH_DB_NAME:auth_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${MYSQL_USER:${SMARTLAB_DB_USER:${SPRING_DATASOURCE_USERNAME:root}}}
spring.datasource.password=${MYSQL_PASSWORD:${SMARTLAB_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Karthi}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN

# ============================================================
# JWT — shared secret, MUST match business service
# ============================================================
jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServicesForSmartLabAI}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.jwt.secret=${JWT_SECRET:ChangeThisToARandom256BitSecretKeySharedByBothServicesForSmartLabAI}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ============================================================
# Inter-service communication
# ============================================================
smartlab.service.url=${SMARTLAB_SERVICE_URL:http://localhost:8082/api/business}

# ============================================================
# CORS Configuration
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}

# ============================================================
# Gmail SMTP — TLS / App Password
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:smartlab.college.auth@gmail.com}
spring.mail.password=${MAIL_PASSWORD:smzltbyohgnfwerj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# ============================================================
# OTP Configuration
# ============================================================
otp.expiry.minutes=5
otp.resend.cooldown.seconds=60
otp.cleanup.interval.ms=1800000

# ============================================================
# Eureka Service Discovery
# ============================================================
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.instance.prefer-ip-address=true

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Logging
# ============================================================
logging.level.org.springframework.security=INFO
logging.level.com.auth=INFO

